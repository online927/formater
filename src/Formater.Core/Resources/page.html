<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Quotation</title>
<style>
@font-face{font-family:U;src:url(data:font/ttf;base64,{{FONT_REGULAR}}) format("truetype");font-weight:400;font-style:normal}
@font-face{font-family:U;src:url(data:font/ttf;base64,{{FONT_BOLD}}) format("truetype");font-weight:700;font-style:normal}
@page{size:A4;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff}
body{font-family:U;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{position:relative;width:595.42pt;height:841.69pt;overflow:hidden;background:#fff}
.t{position:absolute;line-height:1;white-space:nowrap}
.wm{position:absolute;left:83pt;top:212pt;width:430pt;height:393.4pt;opacity:.065}
.banner{position:absolute;left:14pt;top:46pt;width:264.15pt;height:70pt}
.frame{position:absolute;left:0;top:0}
#tpl{display:none}
#measure{position:absolute;left:-20000px;top:0;visibility:hidden;line-height:1;white-space:nowrap;font-family:U}
#msg{display:none;font:14px sans-serif;color:#fff;background:#a00;padding:12px 16px}
body.font-error #msg{display:block}
@media screen{
  html,body{background:#80858c}
  #pages{zoom:var(--z,1);padding:14px 0 1px}
  .page{margin:0 auto 14px;box-shadow:0 2px 12px rgba(0,0,0,.35)}
}
@media print{
  #pages{zoom:1}
  .page{break-after:page}
  .page:last-child{break-after:auto}
  #measure,#msg{display:none}
}
</style>
</head>
<body>
<div id="tpl"><div id="tpl-banner">{{LOGO_BANNER}}</div><div id="tpl-wm">{{LOGO_SQUARE}}</div></div>
<div id="measure"></div>
<div id="msg">The Ubuntu fonts did not load, so the PDF would not match the layout. Export is blocked.</div>
<div id="pages"></div>
<script id="data" type="application/json">{{DATA}}</script>
<script>
{{LAYOUT_JS}}
</script>
</body>
</html>
